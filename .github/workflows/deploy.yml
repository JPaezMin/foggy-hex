name: Deploy to cPanel via rsync

on:
  push:
    branches: [deploy]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${DEPLOY_PORT:-22} -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Deploy via rsync
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${DEPLOY_PORT:-22}"
          if [ -d public ]; then
            rsync -avz --delete -e "$RSYNC_SSH" public/ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
          fi
          if [ -d _nuxt ]; then
            rsync -avz --delete -e "$RSYNC_SSH" _nuxt/ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/_nuxt/
          fi
          for f in index.html 200.html 404.html; do
            if [ -f "$f" ]; then
              rsync -avz -e "$RSYNC_SSH" "$f" ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
            fi
          done
